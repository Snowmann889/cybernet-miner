<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CyberNet Miner - A premium cyberpunk browser clicker game. Hack the core, upgrade nodes, and build your digital empire.">
    <title>CyberNet Miner // Hacking Clicker Game</title>
    <!-- Fonts: Orbitron for headings, Inter for UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Orbitron:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="cyber-grid-background"></div>
    <div class="scanlines"></div>

    <div class="game-container">
        <!-- HEADER -->
        <header class="game-header">
            <div class="logo-area">
                <span class="cyber-accent">//</span>
                <h1>CYBERNET<span class="highlight">_MINER</span></h1>
                <span class="version">v1.2.4</span>
            </div>
            <div class="system-status">
                <span class="status-indicator online"></span>
                <span class="status-text">SYSTEM: ACTIVE</span>
            </div>
        </header>

        <!-- MAIN AREA -->
        <main class="main-layout">
            <!-- CORE AREA -->
            <section class="core-section">
                <div class="stats-panel glass-panel">
                    <div class="stat-group">
                        <div class="stat-label">TOTAL DATACOINS COLLECTED</div>
                        <div class="stat-value" id="coins-display">0.00</div>
                        <div class="stat-sub" id="coins-per-sec">0.00 / SEC</div>
                    </div>
                </div>

                <div class="core-container">
                    <div class="core-glow-ring"></div>
                    <div class="core-outer-ring"></div>
                    <button class="cyber-core" id="click-core" aria-label="Hack Cyber Core">
                        <div class="core-inner">
                            <span class="core-symbol">&lt;/&gt;</span>
                        </div>
                    </button>
                    <div class="core-reflections"></div>
                </div>

                <div class="tip-banner">
                    <span class="tip-label">HINT:</span>
                    <span class="tip-text" id="tip-text">Unlock "Sub-Routine Bot" to start passive income.</span>
                </div>
            </section>

            <!-- SHOP / UPGRADES AREA -->
            <section class="shop-section">
                <div class="shop-header">
                    <h2><span class="cyber-accent">></span> UPGRADES & NODES</h2>
                </div>
                
                <div class="shop-categories">
                    <button class="category-btn active" data-category="auto">AUTOMATION</button>
                    <button class="category-btn" data-category="click">HARDWARE & CLICK</button>
                </div>

                <div class="shop-items" id="shop-container">
                    <!-- Upgrades will be generated dynamically by JS -->
                </div>
            </section>
        </main>

        <!-- FOOTER & CONTROLS -->
        <footer class="game-footer">
            <div class="stats-dock glass-panel">
                <div class="dock-stat">
                    <span class="dock-label">DPC:</span>
                    <span class="dock-val" id="dpc-display">1.00</span>
                </div>
                <div class="dock-stat">
                    <span class="dock-label">TOTAL CLICKS:</span>
                    <span class="dock-val" id="clicks-display">0</span>
                </div>
                <div class="dock-stat">
                    <span class="dock-label">UPGRADES OWNED:</span>
                    <span class="dock-val" id="upgrades-display">0</span>
                </div>
            </div>

            <div class="control-actions">
                <button class="control-btn" id="save-btn" title="Manual Save">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    SAVE
                </button>
                <button class="control-btn" id="reset-btn" title="Reset All Progress">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
                    RESET
                </button>
            </div>
        </footer>
    </div>

    <!-- Notification system -->
    <div class="notification-container" id="notification-container"></div>

    <script src="app.js"></script>
</body>
</html>
